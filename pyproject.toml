[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-sync"
version = "0.1.0"
description = "Microservice to reconcile Radarr movie libraries with JustWatch streaming availability"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "arrapi>=1.4,<2",
  "plexapi>=4.15,<5",
  "simple-justwatch-python-api>=1.3,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
